name: Configure Netlify proxy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy proxy configuration to Netlify
        run: npx netlify-cli@latest deploy --dir=netlify-proxy --prod --site "$NETLIFY_SITE_ID" --message "Configure GitHub Pages proxy"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
