name: Deploy frontend shell to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'formar-biolink.html'
      - 'admin.html'
      - 'logo.png'
      - 'netlify.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --dir=. --prod --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
